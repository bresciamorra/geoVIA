<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>geoVIA — Accesso</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.logo {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: #1a252f;
  margin-bottom: 8px;
}
.logo span { color: #27ae60; }
.subtitle {
  text-align: center;
  font-size: 12px;
  color: #95a5a6;
  margin-bottom: 32px;
}
.tabs {
  display: flex;
  border-bottom: 2px solid #f0f2f5;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  font-size: 14px;
  color: #95a5a6;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.tab.active { color: #27ae60; border-bottom-color: #27ae60; font-weight: 600; }
.form { display: none; flex-direction: column; gap: 16px; }
.form.active { display: flex; }
label { font-size: 12px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.3px; }
input {
  padding: 12px 14px;
  border: 1px solid #dde1e7;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
input:focus { border-color: #27ae60; }
.btn {
  padding: 13px;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.btn:hover { background: #219a52; }
.btn:disabled { background: #95a5a6; cursor: not-allowed; }
.error {
  background: #fde8e8;
  color: #c0392b;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.success {
  background: #e8f5e9;
  color: #27ae60;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.form-group { display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌍 geo<span>VIA</span></div>
  <div class="subtitle">Environmental Intelligence & Decision Support</div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Accedi</div>
    <div class="tab" onclick="switchTab('register')">Registrati</div>
  </div>

  <!-- LOGIN -->
  <form class="form active" id="form-login" onsubmit="doLogin(event)">
    <div class="error" id="login-error"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="nome@studio.it" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button class="btn" type="submit" id="btn-login">Accedi</button>
  </form>

  <!-- REGISTER -->
  <form class="form" id="form-register" onsubmit="doRegister(event)">
    <div class="error" id="register-error"></div>
    <div class="success" id="register-success"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="nome@studio.it" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password (min. 6 caratteri)</label>
      <input type="password" id="reg-password" placeholder="••••••••" required autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label>Conferma Password</label>
      <input type="password" id="reg-password2" placeholder="••••••••" required autocomplete="new-password"/>
    </div>
    <button class="btn" type="submit" id="btn-register">Crea Account</button>
  </form>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['login','register'][i] === tab);
  });
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  document.getElementById(`form-${tab}`).classList.add('active');
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Accesso...';
  err.style.display = 'none';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      })
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = '/';
    } else {
      err.textContent = data.error;
      err.style.display = 'block';
    }
  } catch(ex) {
    err.textContent = 'Errore di connessione';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Accedi';
}

async function doRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-register');
  const err = document.getElementById('register-error');
  const ok = document.getElementById('register-success');
  err.style.display = 'none'; ok.style.display = 'none';

  const p1 = document.getElementById('reg-password').value;
  const p2 = document.getElementById('reg-password2').value;
  if (p1 !== p2) {
    err.textContent = 'Le password non coincidono';
    err.style.display = 'block'; return;
  }
  btn.disabled = true; btn.textContent = 'Registrazione...';
  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('reg-email').value,
        password: p1
      })
    });
    const data = await res.json();
    if (data.ok) {
      ok.textContent = 'Account creato! Puoi ora accedere.';
      ok.style.display = 'block';
      setTimeout(() => switchTab('login'), 1500);
    } else {
      err.textContent = data.error;
      err.style.display = 'block';
    }
  } catch(ex) {
    err.textContent = 'Errore di connessione';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Crea Account';
}
</script>
</body>
</html>
